<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0F19"/>

  <!-- Radial Glow Accents -->
  <circle cx="600" cy="150" r="450" fill="url(#indigo-glow)" opacity="0.45"/>
  <circle cx="950" cy="450" r="350" fill="url(#purple-glow)" opacity="0.3"/>
  <circle cx="200" cy="500" r="300" fill="url(#cyan-glow)" opacity="0.25"/>

  <!-- Subtle Grid Pattern -->
  <defs>
    <radialGradient id="indigo-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 150) rotate(90) scale(450)">
      <stop stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 450) rotate(90) scale(350)">
      <stop stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 500) rotate(90) scale(300)">
      <stop stop-color="#00A3FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glass Card Overlay -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#111827" fill-opacity="0.75" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Badge -->
  <rect x="130" y="130" width="360" height="36" rx="18" fill="#6366F1" fill-opacity="0.18" stroke="#6366F1" stroke-opacity="0.4"/>
  <text x="150" y="153" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#818CF8" letter-spacing="1">⚡ SHAADOW PLATFORMS · EPHEMERAL CHAT</text>

  <!-- Main Headline -->
  <text x="130" y="235" font-family="Plus Jakarta Sans, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">YoFAMN — Fun At Mid Night</text>
  <text x="130" y="305" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)">Private 2-Person Ephemeral P2P Chat</text>

  <!-- Subtitle -->
  <text x="130" y="365" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="500" fill="#9CA3AF">Zero logs. Zero signups. Messages exist strictly in volatile RAM and self-destruct.</text>

  <!-- Feature Badges -->
  <g transform="translate(130, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="24" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#10B981">🔒 Zero Data Storage</text>

    <!-- Badge 2 -->
    <rect x="236" y="0" width="220" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="260" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#818CF8">⚡ WebRTC Encrypted</text>

    <!-- Badge 3 -->
    <rect x="472" y="0" width="250" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="496" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#00A3FF">📱 Powered by Boofer Engine</text>
  </g>

  <!-- CTA Box Right Side -->
  <g transform="translate(860, 415)">
    <rect x="0" y="0" width="210" height="50" rx="16" fill="url(#btn-grad)"/>
    <text x="40" y="31" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">yofamn.vercel.app</text>
  </g>
</svg>
